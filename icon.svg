<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Website Wala Same Gradient -->
    <linearGradient id="medvaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#medvaultGrad)"/>
  
  <!-- Subtle Border Line -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Official Medical Emblem (Same as Website ⚕) -->
  <g filter="url(#softGlow)" fill="#ffffff">
    <!-- Center Staff (Danda) -->
    <rect x="246" y="90" width="20" height="332" rx="10"/>
    <circle cx="256" cy="85" r="18"/>
    
    <!-- Smooth Serpent Coils -->
    <path d="M 230 140 C 290 150, 310 190, 270 215 C 230 240, 200 270, 256 300 C 310 330, 280 375, 256 385 C 230 395, 235 410, 256 410 C 270 410, 275 395, 256 380 C 235 365, 220 335, 265 305 C 315 270, 315 230, 260 205 C 215 180, 215 145, 240 135" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Serpent Head Angle -->
    <circle cx="230" cy="138" r="11"/>
  </g>
</svg>
